<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070a10; overflow: hidden; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #070a10; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
               justify-content: center; color: #39ffb0; font: 16px/1.4 Consolas, "Courier New", monospace; }
    #bar { width: 260px; height: 6px; background: #132030; margin-top: 14px; }
    #fill { width: 0; height: 100%; background: #39ffb0; transition: width .1s; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div>BITSHIFT // loading registers...</div><div id="bar"><div id="fill"></div></div></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    canvas.addEventListener("pointerdown", function () { canvas.focus(); });
    createUnityInstance(canvas, {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    }, function (p) {
      document.querySelector("#fill").style.width = (100 * p) + "%";
    }).then(function () {
      document.querySelector("#loading").remove();
      canvas.focus();
    }).catch(function (m) { alert(m); });
  </script>
</body>
</html>
