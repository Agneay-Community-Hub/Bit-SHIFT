<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070a10; overflow: hidden; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #070a10; outline: none; }
    #loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
               justify-content: center; color: #39ffb0; font: 16px/1.4 Consolas, "Courier New", monospace; }
    #bar { width: 260px; height: 6px; background: #132030; margin-top: 14px; }
    #fill { width: 0; height: 100%; background: #39ffb0; transition: width .1s; }
    #msg { max-width: 560px; margin-top: 22px; padding: 0 16px; color: #ffd166; text-align: center; white-space: pre-line; }
    #msg code { color: #fff; background: #132030; padding: 2px 6px; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading"><div>BITSHIFT // loading registers...</div><div id="bar"><div id="fill"></div></div><div id="msg"></div></div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    canvas.addEventListener("pointerdown", function () { canvas.focus(); });

    function showError(html) {
      document.querySelector("#msg").innerHTML = html;
      document.querySelector("#bar").style.display = "none";
    }

    // Any script error (a missing Build/ file, a blocked request) shows on the page instead of a frozen bar.
    window.addEventListener("error", function (e) {
      if (document.querySelector("#loading"))
        showError("SEGFAULT while loading:\n" + String(e.message || (e.target && e.target.src) || e).replace(/</g, "&lt;"));
    }, true);

    // Browsers block a page opened from disk (file://) from fetching its own Build/ files,
    // so Unity would sit at 0% forever. Explain that instead of hanging.
    if (location.protocol === "file:") {
      showError("SEGFAULT: this page was opened directly from disk.\n\n" +
        "Browsers won't load WebGL games from file://.\nServe this folder over HTTP instead, e.g.\n\n" +
        "<code>python -m http.server 8000</code>\n\nthen open <code>http://localhost:8000</code>, " +
        "or play it on itch.io.");
    } else if (typeof createUnityInstance !== "function") {
      showError("SEGFAULT: Build/{{{ LOADER_FILENAME }}} did not load.\nMake sure index.html and the Build folder are at the top level of the upload.");
    } else {
    var stalled = setTimeout(function () {
      showError("Still loading after 30 s.\nCheck your connection, or try another browser (Chrome, Firefox, Edge).");
    }, 30000);
    createUnityInstance(canvas, {
      dataUrl: "Build/{{{ DATA_FILENAME }}}",
      frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
      codeUrl: "Build/{{{ CODE_FILENAME }}}",
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    }, function (p) {
      document.querySelector("#fill").style.width = (100 * p) + "%";
    }).then(function () {
      clearTimeout(stalled);
      document.querySelector("#loading").remove();
      canvas.focus();
    }).catch(function (m) {
      clearTimeout(stalled);
      showError("SEGFAULT while loading:\n" + String(m).replace(/</g, "&lt;"));
    });
    }
  </script>
</body>
</html>
